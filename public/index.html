<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omni DSG</title>
<style>
:root{--g:#2a2a2a;--bg:#ecebe8;--s:#f8f7f5;--l:#d9d7d2;--f:#232322;--f2:#6b6965;--bad:#b4483c}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Montserrat","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--f)}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px}
h1{font-weight:500;font-size:22px;margin:0 0 4px}.muted{color:var(--f2)}
.card{background:var(--s);border:1px solid var(--l);border-radius:10px;padding:18px;margin-top:16px}
input,select,button{font:inherit}input,select{border:1px solid var(--l);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.ghost{background:none;color:var(--f);border:1px solid var(--l)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--l)}.row:first-child{border-top:0}
.err{color:var(--bad);min-height:18px}.pill{font-size:11px;border:1px solid var(--l);border-radius:20px;padding:2px 8px;white-space:nowrap}
form{display:grid;gap:10px;max-width:340px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Omni DSG</h1>
  <div class="muted">Сервер работает. Это служебная страница проверки API — рабочий интерфейс подключается следующим этапом.</div>
  <div id="view"></div>
</div>
<script>
const api = async (method, url, body, headers) => {
  const h = Object.assign({ 'X-Omni-Request': '1' }, headers || {});
  let b = body;
  if (body !== undefined && !(body instanceof Blob)) { h['Content-Type'] = 'application/json'; b = JSON.stringify(body); }
  const r = await fetch(url, { method, headers: h, body: b, credentials: 'same-origin' });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((d.error && d.error.message) || r.statusText);
  return d;
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function start() {
  try { const { user } = await api('GET', '/api/me'); home(user); } catch { login(); }
}
function login() {
  $('view').innerHTML = `<div class="card"><form id="f"><b>Вход</b><input id="l" placeholder="Логин" autocomplete="username"><input id="p" type="password" placeholder="Пароль" autocomplete="current-password"><div class="err" id="e"></div><button>Войти</button></form></div>`;
  $('f').onsubmit = async (ev) => { ev.preventDefault(); try { const { user } = await api('POST', '/api/auth/login', { login: $('l').value, password: $('p').value }); home(user); } catch (e) { $('e').textContent = e.message; } };
}
async function home(user) {
  let h = `<div class="card"><div class="row"><div><b>${esc(user.name)}</b><div class="muted">${esc(user.role)}${user.position ? ' · ' + esc(user.position.name) : ''} · Контур: ${esc(user.kontur)}</div></div><button class="ghost" id="out">Выйти</button></div>
    <div class="muted" style="font-size:12px">Права: ${user.perms.map(esc).join(', ') || '—'}</div></div>`;
  if (user.mustChangePassword) h += `<div class="card"><form id="pw"><b>Смените временный пароль</b><input id="c" type="password" placeholder="Текущий пароль"><input id="n" type="password" placeholder="Новый: от 8 символов, буквы и цифры"><div class="err" id="pe"></div><button>Сохранить</button></form></div>`;
  const { projects } = await api('GET', '/api/projects');
  h += `<div class="card"><b>Проекты</b>${projects.map((p) => `<div class="row"><div>${esc(p.name)}<div class="muted" style="font-size:12px">${esc(p.stageName)} ${p.stagePct}% · ${p.members.length} в команде</div></div><button class="ghost" data-p="${p.id}">Файлы</button></div>`).join('') || '<div class="muted">Нет проектов</div>'}</div><div id="files"></div>`;
  $('view').innerHTML = h;
  $('out').onclick = async () => { await api('POST', '/api/auth/logout'); login(); };
  if ($('pw')) $('pw').onsubmit = async (ev) => { ev.preventDefault(); try { await api('POST', '/api/me/password', { current: $('c').value, next: $('n').value }); home(Object.assign(user, { mustChangePassword: false })); } catch (e) { $('pe').textContent = e.message; } };
  document.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => files(user, b.dataset.p));
}
async function files(user, pid) {
  const box = $('files');
  try {
    const { files } = await api('GET', `/api/projects/${pid}/files`);
    box.innerHTML = `<div class="card"><b>Файлы</b>${files.map((f) => `<div class="row"><a href="/api/files/${f.id}/download">${esc(f.name)}</a><span class="pill">${f.public ? 'заказчику' : 'внутреннее'}</span></div>`).join('') || '<div class="muted">Пока пусто</div>'}
      ${user.perms.includes('storage') ? `<div class="row"><input type="file" id="up"><button id="ub">Загрузить</button></div><div class="err" id="ue"></div>` : ''}</div>`;
    if ($('ub')) $('ub').onclick = async () => { const f = $('up').files[0]; if (!f) return; try { await api('POST', `/api/projects/${pid}/files`, f, { 'X-File-Name': encodeURIComponent(f.name), 'Content-Type': f.type || 'application/octet-stream' }); files(user, pid); } catch (e) { $('ue').textContent = e.message; } };
  } catch (e) { box.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}
start();
</script>
</body>
</html>
